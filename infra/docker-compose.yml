services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: imo
      POSTGRES_PASSWORD: imo
      POSTGRES_DB: imo
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
volumes:
  pgdata:
